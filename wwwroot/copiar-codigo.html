<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Copiar código · Aprendor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<!--
  Página del botón «Copiar código» de los correos con código (validar correo, doble factor,
  registrar o recuperar la app autenticadora). El código llega en el fragmento
  (copiar-codigo.html#123456), que el navegador no manda al servidor. Al abrirse:
    1. lo copia al portapapeles y dice «Código copiado» (si el navegador no deja copiar
       sin un clic, queda el botón «Copiar código»);
    2. se lo pasa por BroadcastChannel a las pestañas de Aprendor abiertas en este
       navegador: la que tenga a la vista un campo de código lo escribe y avisa de vuelta.
-->
<style>
  :root{--ink:#111a2e;--muted:#5f6d85;--line:#e3e8f1;--brand:#4f46e5;--brand-d:#4338ca;--ok:#15803d;--ok-bg:#dcfce7;--err:#b91c1c;
    --display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--ink);font:15px/1.5 var(--body);
    background:radial-gradient(1100px 520px at 75% -10%,#26324f,transparent),linear-gradient(180deg,#1b2540,#0f172a);}
  .card{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:100%;max-width:400px;padding:30px;text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;font:800 20px var(--display);margin-bottom:18px;}
  .codigo{font:700 38px/1 Consolas,Menlo,monospace;letter-spacing:.12em;padding:18px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;
    -webkit-user-select:all;user-select:all;}
  .estado{margin:16px 0 0;min-height:1.5em;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
  .estado.ok{color:var(--ok);} .estado.err{color:var(--err);}
  .nota{margin:8px 0 0;color:var(--muted);font-size:13.5px;}
  .btn{margin-top:18px;padding:11px 22px;border:none;border-radius:12px;background:var(--brand);color:#fff;font:700 15px var(--body);cursor:pointer;}
  .btn:hover{background:var(--brand-d);}
  .btn:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
      <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg)"/>
      <path d="M9 19 L16 11 L23 19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 22.5 L21 22.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
    </svg>
    Aprendor
  </div>
  <div class="codigo" id="codigo" aria-label="Código de verificación">——————</div>
  <p class="estado" id="estado" role="status" aria-live="polite"></p>
  <p class="nota" id="nota"></p>
  <button type="button" class="btn hidden" id="copiarBtn">Copiar código</button>
</main>
<script>
(function(){
  const el = id => document.getElementById(id);
  const m = /^#?(\d{6})$/.exec(location.hash || '');
  // Quita el código de la barra de direcciones y del historial en cuanto se lee.
  try{ history.replaceState(null, '', location.pathname); }catch{}

  function estado(texto, clase){
    const e = el('estado');
    e.className = 'estado' + (clase ? ' ' + clase : '');
    e.innerHTML = clase === 'ok'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'
      : '';
    e.appendChild(document.createTextNode(texto));
  }

  if (!m){
    estado('Este enlace no trae un código válido.', 'err');
    el('nota').textContent = 'Vuelve al correo y usa el código que aparece ahí.';
    return;
  }
  const codigo = m[1];
  el('codigo').textContent = codigo;

  function copiarConRespaldo(){
    // Respaldo para navegadores sin la API del portapapeles o que la niegan.
    const t = document.createElement('textarea');
    t.value = codigo; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch{}
    t.remove();
    return ok;
  }
  async function copiar(desdeBoton){
    let ok = false;
    try{ await navigator.clipboard.writeText(codigo); ok = true; }
    catch{ if (desdeBoton) ok = copiarConRespaldo(); }
    if (ok){
      estado('Código copiado', 'ok');
      if (!recibido) el('nota').textContent = 'Vuelve a Aprendor y pégalo en el campo del código.';
      el('copiarBtn').textContent = 'Copiar de nuevo';
      el('copiarBtn').classList.remove('hidden');
    } else if (desdeBoton){
      estado('No se pudo copiar', 'err');
      el('nota').textContent = 'Selecciona el código de arriba y cópialo a mano.';
    } else {
      // El navegador pide un clic para copiar: queda el botón.
      el('nota').textContent = 'Pulsa el botón para copiarlo.';
      el('copiarBtn').classList.remove('hidden');
      el('copiarBtn').focus();
    }
  }
  el('copiarBtn').addEventListener('click', () => copiar(true));

  // Si hay una pestaña de Aprendor esperando el código, se lo escribe.
  let recibido = false;
  try{
    const canal = new BroadcastChannel('aprendor-codigo');
    canal.onmessage = ev => {
      if (!ev.data || ev.data.tipo !== 'recibido' || recibido) return;
      recibido = true;
      el('nota').textContent = 'Ya lo escribimos en tu pantalla de Aprendor. Puedes cerrar esta pestaña.';
    };
    canal.postMessage({ tipo: 'codigo', codigo });
  }catch{}

  copiar(false);
})();
</script>
</body>
</html>
