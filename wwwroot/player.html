<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adiestramiento</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand-d:#1d4ed8;--ok:#16a34a;--err:#dc2626;--soft:#f1f5f9;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f8fafc;min-height:100vh;display:flex;flex-direction:column;}
  header{background:#0b1220;color:#e2e8f0;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  header .t{font-weight:800;} header .p{font-size:13px;color:#94a3b8;}
  header .mod{font-size:12px;color:#93c5fd;font-weight:600;margin-top:2px;}
  .progress{height:4px;background:#1e293b;} .progress>div{height:100%;background:var(--brand);transition:width .2s;}
  main{flex:1;display:flex;justify-content:center;padding:30px 18px;}
  .stage{width:100%;max-width:760px;}
  .screen{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.06);min-height:300px;}
  .screen img,.screen video{max-width:100%;border-radius:10px;margin:12px auto;display:block;}
  .screen audio{width:100%;margin:12px 0;}
  .row2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0;}
  .row2>div{flex:1 1 220px;min-width:220px;}
  .row2 img,.row2 video{margin:0 auto;display:block;}
  .matchrow{display:flex;gap:12px;align-items:center;margin:8px 0;}
  .matchrow .mp{flex:1;font-weight:600;}
  .matchrow select{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;}
  .opentext{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;}
  .opentext-ro{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;}
  .screen h1{font-size:28px;} .screen h2{font-size:20px;}
  .module{text-align:center;padding:60px 10px;}
  .module .tag{display:inline-block;background:var(--soft);color:var(--muted);padding:4px 12px;border-radius:99px;font-size:13px;}
  .opt{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;}
  .opt.correct{background:#dcfce7;border-color:#86efac;} .opt.wrong{background:#fee2e2;border-color:#fca5a5;}
  .opt .mk{margin-left:auto;font-size:12px;color:var(--muted);}
  .sumrow{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;}
  .sumrow .st{margin-left:auto;}
  .nav{display:flex;gap:10px;max-width:760px;margin:18px auto 40px;width:100%;padding:0 18px;}
  .btn{padding:12px 18px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;}
  .btn:hover{background:var(--brand-d);} .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line);} .btn.ok{background:var(--ok);}
  .res{margin-top:18px;padding:18px;border-radius:12px;font-weight:700;font-size:18px;text-align:center;}
  .res.pass{background:#dcfce7;color:#166534;} .res.fail{background:#fee2e2;color:#991b1b;}
  .center{max-width:760px;margin:60px auto;padding:0 18px;text-align:center;color:var(--muted);}
  a{color:var(--brand);}
  .hintbox{background:#fef9c3;border:1px solid #fde68a;color:#854d0e;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;}
  .hidden{display:none !important;}
  /* Botones de acción de una pantalla de resultado o de resumen: siempre centrados. */
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:18px;}

  /* ---- Indicador de carga: barra fina arriba mientras el reproductor espera al servidor,
     aviso centrado en la carga inicial y botón ocupado (deshabilitado, con giro) ---- */
  #busyBar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .15s;}
  #busyBar.on{opacity:1;}
  #busyBar::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--pacc,#2563eb);animation:busySlide 1.1s ease-in-out infinite;}
  body:not(.pres) #busyBar::before{background:var(--brand);}
  @keyframes busySlide{0%{left:-40%;}100%{left:100%;}}
  .spin{display:inline-block;width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-.15em;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:240px;color:var(--muted);font-size:15px;text-align:center;}
  .loading .spin{width:30px;height:30px;border-width:3px;color:var(--brand);}
  .is-busy{pointer-events:none;opacity:.75;cursor:progress !important;}
  .is-busy .spin{margin-right:8px;}
  #busyToast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:61;display:none;align-items:center;gap:10px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font:600 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  #busyToast.on{display:flex;}
  @media (prefers-reduced-motion:reduce){ #busyBar::before{animation-duration:2.4s;} .spin{animation-duration:1.4s;} }

  /* ===================== Modo presentación (PlayerConfig.presentation) =====================
     Cada página se dibuja en un escenario fijo de 1280×720 escalado a la ventana. Los
     marcadores PRES-CSS delimitan el bloque que content/<curso>/seed.mjs --preview copia
     a preview.html para que la revisión estática se vea igual que el reproductor. */
  /*PRES-CSS-START*/
  :root{--pbg:#0d0d0d;--pacc:#f97316;}
  body.pres{overflow:hidden;background:var(--pbg);}
  body.pres>header,body.pres>.progress,body.pres>main,body.pres>.nav{display:none !important;}
  #presRoot{display:none;}
  body.pres #presRoot{display:block;position:fixed;inset:0;background:var(--pbg);}
  /* El escenario se coloca en píxeles enteros (--px/--py, ver presFit): con left:50% y
     translate(-50%) una ventana de ancho impar dejaba la lámina en medio píxel y el texto
     se veía borroso. */
  .pstage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--pk,1));overflow:hidden;background:var(--pbg);}
  .player{position:absolute;inset:0;}
  /* Transiciones cortas (~320 ms). Al terminar se quitan las clases: la lámina queda sin
     transform y la saliente se retira siempre (transitionend con respaldo por tiempo).
     isolation:isolate: cada lámina encierra sus z-index (el título del panel en split lleva
     z-index:2). Sin esto la saliente, que ya no tiene transform, no crea contexto de
     apilamiento y su título se pintaba ENCIMA de la entrante durante la transición (la
     sombra o el título doble). Así el orden lo decide el DOM: la que va después, encima. */
  .slide{position:absolute;inset:0;isolation:isolate;transition:transform .32s cubic-bezier(.2,.7,.2,1),opacity .28s ease;}
  .slide.from-right{transform:translateX(100%);box-shadow:-16px 0 32px rgba(0,0,0,.35);}
  .slide.from-right.in{transform:translateX(0);}
  .slide.to-right{transform:translateX(100%);box-shadow:-16px 0 32px rgba(0,0,0,.35);}
  .slide.fade-in{opacity:0;} .slide.fade-in.in{opacity:1;}
  .slide.fade-out{opacity:0;}
  /* Misma lámina de fondo (mismo layout, variante y título del panel o del encabezado): el
     marco queda fijo y solo entra el contenido, sin arrastrar una copia del título. */
  .slide.keep .sl-body{animation:slBodyIn .3s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes slBodyIn{from{opacity:0;transform:translateX(calc(var(--dx,1) * 28px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .slide{transition:none !important;} .slide.keep .sl-body{animation:none !important;} }

  /* --- lámina: base --- */
  .sl{position:absolute;inset:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;background:var(--pbg);line-height:1.25;}
  .sl *{box-sizing:border-box;}
  .sl-body{position:absolute;overflow:hidden;}
  .sl-fit{transform-origin:top left;}
  .sl-body p{margin:0 0 14px;}
  .sl-body ul{margin:0 0 10px;padding-left:32px;} .sl-body li{margin:0 0 10px;}
  .sl-body ul ul{margin:8px 0 0;list-style:disc;} .sl-body li li{margin:0 0 6px;font-size:.92em;}
  .sl-body h2{font-size:30px;font-weight:700;margin:0 0 16px;line-height:1.15;}
  .sl-body h3{font-size:28px;font-weight:700;text-transform:uppercase;margin:0 0 12px;line-height:1.2;}
  .sl-body a{color:var(--pacc);}
  .sl-body img,.sl-body video{max-width:100%;max-height:360px;border-radius:0;margin:10px 0;}
  .sl-body .row2{margin:0;}
  .sl-over{position:absolute;top:14px;right:14px;z-index:5;background:#dc2626;color:#fff;font:700 14px/1 system-ui,sans-serif;padding:8px 12px;border-radius:8px;}
  .sl-kicker{margin:0;}

  /* --- cover: foto a sangre + banda de título --- */
  .sl-cover .cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .sl-cover .cover-band{position:absolute;left:0;right:0;top:548px;height:96px;background:rgba(255,255,255,.86);border-top:2px solid #2a2a2a;border-bottom:2px solid #2a2a2a;box-shadow:0 -5px 0 rgba(255,255,255,.75),0 5px 0 rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 60px;}
  .sl-cover .cover-band h1{margin:0;font-size:44px;font-weight:700;color:#111;line-height:1.1;}
  .sl-cover .sl-body{left:90px;right:90px;top:660px;bottom:0;font-size:18px;}

  /* --- dark: kicker en mayúsculas arriba, línea de acento, cuerpo --- */
  .sl-dark .sl-kicker{position:absolute;left:100px;right:90px;top:44px;font-size:52px;font-weight:700;text-transform:uppercase;line-height:1.08;}
  .sl-dark .sl-rule{position:absolute;left:88px;right:88px;top:190px;border-top:2px solid var(--pacc);}
  .sl-dark .sl-body{left:96px;right:88px;top:216px;bottom:36px;font-size:24px;}
  .sl-dark .sl-body h3{border-bottom:2px solid rgba(255,255,255,.45);padding-bottom:4px;margin-bottom:14px;}
  .sl-dark.sl-mod .sl-kicker{top:250px;font-size:56px;} .sl-dark.sl-mod .sl-rule{top:400px;} .sl-dark.sl-mod .sl-body{top:420px;font-size:26px;color:#cfcfcf;}

  /* --- pregunta: dark con marco de acento y opciones clicables --- */
  .sl-q .sl-frame{position:absolute;inset:12px;border:2px solid var(--pacc);pointer-events:none;}
  .sl-q .sl-kicker{position:absolute;left:100px;top:118px;font-size:64px;font-weight:400;text-transform:uppercase;line-height:1;}
  .sl-q .sl-rule{position:absolute;left:14px;width:550px;top:212px;border-top:2px solid var(--pacc);}
  .sl-q .sl-body{left:160px;right:90px;top:250px;bottom:36px;font-size:30px;}
  .sl-q .qwrap{counter-reset:opt;}
  .sl-q .qwrap+.qwrap{border-top:1px solid #333;margin-top:18px;padding-top:18px;}
  .sl-q .qwrap>b{display:block;font-size:30px;font-weight:700;margin-bottom:26px;}
  .sl-q .opt{counter-increment:opt;position:relative;display:flex;align-items:center;background:none;border:0;border-radius:8px;padding:6px 12px;margin:2px 0;font-size:30px;line-height:1.25;color:#fff;cursor:pointer;gap:0;}
  .sl-q .opt::before{content:counter(opt,lower-alpha) ".";flex:none;width:46px;}
  .sl-q .opt:hover{background:rgba(255,255,255,.08);}
  .sl-q .opt:has(input:checked){background:color-mix(in srgb,var(--pacc) 18%,transparent);outline:2px solid var(--pacc);}
  .sl-q .opt.correct{background:rgba(22,163,74,.25);} .sl-q .opt.wrong{background:rgba(220,38,38,.25);}
  .sl-q .opt input{position:absolute;opacity:0;width:0;height:0;margin:0;}
  .sl-q .opt .mk{margin-left:auto;color:#cfcfcf;font-size:16px;}
  .sl-q .qwrap>.mk{color:#bbb;font-size:18px;}
  .sl-q .matchrow{display:flex;gap:12px;align-items:center;margin:8px 0;} .sl-q .matchrow .mp{flex:1;font-size:24px;font-weight:600;}
  .sl-q .matchrow select,.sl-q .opentext{background:#1c1c1c;color:#fff;border:1px solid #4a4a4a;font-size:22px;}
  .sl-q .opentext{min-height:170px;} .sl-q .opentext-ro{background:#1c1c1c;border-color:#4a4a4a;font-size:22px;}
  .sl-q .hintbox{font-size:18px;}

  /* --- split: panel diagonal oscuro + contenido sobre blanco --- */
  .sl-split{background:#fff;color:#111;}
  .sl-split .panel{position:absolute;left:0;top:0;width:494px;height:720px;background:#1f1f1f;overflow:hidden;}
  .sl-split .panel::before{content:"";position:absolute;inset:0;background:#2e2e2e;clip-path:polygon(18% 0,100% 0,100% 100%,69% 100%);}
  /* centrado vertical con flex (no translateY(-50%), que deja medio píxel y texto borroso) */
  .sl-split .ptitle{position:absolute;left:98px;width:340px;top:0;bottom:0;display:flex;align-items:center;margin:0;font-size:34px;font-weight:700;text-transform:uppercase;color:#fff;line-height:1.15;z-index:2;}
  .sl-split .sl-body{left:575px;right:80px;top:50px;bottom:36px;font-size:24px;display:flex;flex-direction:column;}
  .sl-split .sl-fit{margin:auto 0;}   /* centrado vertical seguro: si desborda, queda arriba */
  .sl-split .sl-body p{margin-bottom:10px;} .sl-split .sl-body li{margin-bottom:8px;}
  .sl-split .sl-body h2{font-size:30px;margin-bottom:14px;}
  .sl-split .sl-body h3{font-size:26px;text-transform:none;margin:4px 0 8px;}
  /* variante right: panel blanco a la izquierda con el título en negro, contenido sobre oscuro */
  .sl-split.right .panel{left:auto;right:0;width:960px;background:transparent;}
  .sl-split.right .panel::before{background:#6a6a6a;clip-path:polygon(31% 0,100% 0,100% 100%,0 100%);}
  .sl-split.right .panel::after{content:"";position:absolute;inset:0;background:#262626;clip-path:polygon(34.5% 0,100% 0,100% 100%,3.6% 100%);}
  .sl-split.right .ptitle{color:#111;width:380px;left:100px;}
  .sl-split.right .sl-body{left:655px;right:50px;top:36px;bottom:24px;color:#fff;font-size:23px;}
  .sl-split.right .sl-body li{margin-bottom:6px;}
  /* variante lines: fondo oscuro, título del panel entre dos líneas de acento */
  .sl-split.lines{background:var(--pbg);color:#fff;}
  .sl-split.lines .panel{width:520px;background:transparent;}
  .sl-split.lines .panel::before{background:transparent;clip-path:none;left:105px;right:0;top:150px;bottom:150px;border-top:2px solid var(--pacc);border-bottom:2px solid var(--pacc);}
  .sl-split.lines .ptitle{left:118px;width:400px;font-size:40px;}
  .sl-split.lines .sl-body{left:655px;right:80px;font-size:30px;}
  .sl-split.lines .sl-body h2{font-size:38px;}
  /* theme.panel=false: sin panel diagonal, contenido a lo ancho con el título del panel pequeño arriba */
  .sl-split.no-panel .panel,.sl-split.no-panel .ptitle{display:none;}
  .sl-split.no-panel .sl-body{left:90px;right:90px;top:70px;}
  .sl-split.no-panel .sl-kicker{position:absolute;left:90px;top:28px;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;}

  /* --- photo-left: foto a la izquierda, contenido a la derecha sobre blanco --- */
  .sl-photo{background:#fff;color:#111;}
  .sl-photo .photo{position:absolute;left:0;top:0;width:486px;height:720px;object-fit:cover;object-position:var(--ppos,50% 50%);}
  .sl-photo .sl-kicker{position:absolute;left:535px;right:85px;top:100px;font-size:34px;font-weight:700;text-transform:uppercase;line-height:1.15;}
  .sl-photo .sl-rule{position:absolute;left:535px;right:85px;top:218px;border-top:3px solid var(--pacc);}
  .sl-photo .sl-body{left:535px;right:85px;top:255px;bottom:40px;font-size:24px;}
  .sl-photo .sl-body h2{font-size:30px;}

  /* --- resumen y resultado como láminas --- */
  .sl-sum .sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;}
  .sl-sum .sumrow{display:flex;gap:10px;border-bottom:1px solid #333;font-size:19px;padding:8px 2px;} .sl-sum .sumrow .st{margin-left:auto;}
  .sl .res{font-size:30px;font-weight:700;text-align:center;padding:12px;margin-top:14px;border-radius:12px;}
  .sl .res.pass{background:transparent;color:#4ade80;} .sl .res.fail{background:transparent;color:#f87171;}
  .sl .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:24px;}
  .sl-sum .actions{margin-top:14px;}   /* el resumen va justo de alto: que el aviso y los botones quepan */
  .sl .tiempo{color:#bbb !important;font-size:18px !important;text-align:center;}
  .sl .center{margin:20px 0 0;padding:0;color:#bbb;}
  /* Lámina de resultado: todo centrado, con márgenes iguales a los dos lados. */
  .sl-final .sl-kicker{left:90px;right:90px;text-align:center;}
  .sl-final .sl-rule{left:90px;right:90px;}
  .sl-final .sl-body{left:90px;right:90px;display:flex;flex-direction:column;}
  .sl-final .sl-fit{margin:auto 0;text-align:center;}
  .sl .hintbox{background:rgba(254,249,195,.12);border-color:#a16207;color:#fde68a;font-size:16px;}
  .sl .btn,.pbtn{padding:13px 30px;border:0;border-radius:10px;background:var(--pacc);color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;}
  .sl .btn.ghost,.pbtn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);}
  .sl .btn:disabled,.pbtn:disabled{opacity:.45;cursor:not-allowed;}

  /* --- cromo del reproductor: contador, flechas, pantalla de inicio, aviso --- */
  /* Contador «n / N»: va sobre una pastilla oscura translúcida para que se lea igual
     sobre las láminas oscuras que sobre las de fondo blanco (split, photo-left). */
  .pres-counter{position:fixed;right:16px;bottom:12px;color:#fff;background:rgba(15,15,15,.55);padding:3px 10px;border-radius:999px;font:600 13px system-ui,sans-serif;letter-spacing:.04em;pointer-events:none;z-index:20;}
  .pres-counter:empty{display:none;}
  .pres-arrow{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:20;transition:opacity .4s;display:flex;align-items:center;justify-content:center;padding:0;}
  .pres-arrow.l{left:14px;} .pres-arrow.r{right:14px;}
  .pres-arrow:hover{background:rgba(0,0,0,.75);}
  #presRoot.idle .pres-arrow{opacity:0;}
  .pres-start{position:fixed;inset:0;z-index:30;background:var(--pbg);color:#fff;display:flex;flex-direction:column;overflow-y:auto;text-align:center;padding:20px;font-family:Arial,Helvetica,sans-serif;container-type:inline-size;}
  .pres-start .ps-inner{position:relative;z-index:1;margin:auto;display:flex;flex-direction:column;align-items:center;width:100%;max-width:980px;}   /* margin:auto centra sin recortar arriba si no cabe */
  .pres-start h1{font-size:34px;margin:0 0 12px;text-transform:uppercase;max-width:800px;}
  .pres-start p{color:#a3a3a3;margin:0 0 28px;font-size:15px;max-width:520px;line-height:1.5;}
  .pres-start .ps-resume{margin-top:14px;color:#e5e5e5;font-size:15px;}
  /* pantalla de entrada del curso (ítem Info con layout 'intro'): foto atenuada, título,
     descripción y fila de datos. Tamaños en cqw: se ajustan al ancho de la pantalla de
     entrada (y al del marco en la vista previa de seed.mjs). */
  .pres-start .ps-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3;pointer-events:none;}
  .pres-start .ps-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,color-mix(in srgb,var(--pbg) 78%,transparent) 55%,var(--pbg) 100%);pointer-events:none;}
  .pres-start.intro h1{font-size:44px;font-size:clamp(28px,5cqw,62px);line-height:1.08;text-transform:none;max-width:none;margin:0 0 18px;}
  .pres-start .ps-rule{width:120px;border-top:3px solid var(--pacc);margin:0 auto 22px;}
  .pres-start .ps-desc{color:#e5e5e5;font-size:18px;font-size:clamp(15px,1.7cqw,21px);line-height:1.55;max-width:760px;margin:0 0 24px;}
  .pres-start .ps-desc p{color:inherit;font-size:inherit;line-height:inherit;max-width:none;margin:0 0 10px;}
  .pres-start .ps-desc b{color:#fff;}
  .pres-start .ps-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 34px;padding:14px 10px;margin:0 0 28px;border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2);}
  .pres-start .ps-stat b{display:block;font-size:30px;font-size:clamp(22px,2.7cqw,34px);font-weight:700;color:var(--pacc);line-height:1.1;}
  .pres-start .ps-stat span{display:block;margin-top:4px;font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#bdbdbd;}
  .pres-start.intro .pbtn{font-size:19px;padding:15px 46px;}
  .pres-start .ps-hint{margin-top:12px;font:13px system-ui,sans-serif;color:#9a9a9a;letter-spacing:.02em;}
  .pres-toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:10px;font:600 14px system-ui,sans-serif;z-index:25;opacity:0;transition:opacity .25s;pointer-events:none;max-width:min(90vw,640px);text-align:center;}
  .pres-toast.show{opacity:1;}
  /*PRES-CSS-END*/
</style>
</head>
<body>
<!-- Indicador de carga (ver setBusy): barra arriba y aviso abajo mientras se espera al servidor. -->
<div id="busyBar" role="progressbar" aria-hidden="true"></div>
<div id="busyToast" role="status" aria-live="polite"><span class="spin"></span><span id="busyText"></span></div>
<header>
  <div>
    <span class="t" id="title">Adiestramiento</span>
    <div class="mod" id="moduleLabel"></div>
  </div>
  <span class="p" id="progressText"></span>
</header>
<div class="progress"><div id="progressBar" style="width:0%"></div></div>
<main><div class="stage"><div class="screen" id="screen"><div class="loading"><span class="spin"></span>Cargando adiestramiento…</div></div></div></main>
<div class="nav" id="nav" style="display:none">
  <button class="btn ghost" id="prevBtn">◂ Anterior</button>
  <button class="btn" id="nextBtn" style="margin-left:auto">Siguiente ▸</button>
  <button class="btn ok hidden" id="finishBtn" style="margin-left:auto">Finalizar</button>
</div>
<!-- Modo presentación: escenario 16:9 escalado, contador, flechas y pantalla de inicio.
     Solo se muestra cuando la configuración del curso trae presentation.enabled. -->
<div id="presRoot">
  <div class="pstage" id="presStage"><div class="player" id="presLayer"></div></div>
  <button class="pres-arrow l" id="presPrev" title="Anterior (←)">&#9664;</button>
  <button class="pres-arrow r" id="presNext" title="Siguiente (→)">&#9654;</button>
  <div class="pres-counter" id="presCounter"></div>
  <div class="pres-toast" id="presToast"></div>
  <!-- Pantalla de entrada. Si el curso trae un ítem 'intro' se añaden la foto atenuada, la
       descripción y los datos del curso (#presStartIntro); si no, solo título y botón. -->
  <div class="pres-start hidden" id="presStart">
    <img class="ps-photo hidden" id="presStartPhoto" alt="" />
    <div class="ps-shade hidden" id="presStartShade"></div>
    <div class="ps-inner">
      <h1 id="presStartTitle"></h1>
      <div class="hidden" id="presStartIntro"></div>
      <p id="presStartHelp">Avanza con → o Espacio y retrocede con ←. Esc sale de pantalla completa sin cerrar el adiestramiento.</p>
      <button class="pbtn" id="presStartBtn">Comenzar</button>
      <div class="ps-resume hidden" id="presStartResume"></div>
      <div class="ps-hint hidden" id="presStartHint">Pantalla completa · avanza con → o Enter</div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const versionId = params.get('v');
const setId     = params.get('set');
const reviewId  = params.get('review');
const previewId = params.get('preview');
const repasoId  = params.get('repaso');   // curso ya aprobado, abierto para consulta
const title = params.get('t') || 'Adiestramiento';
const token = localStorage.getItem('tp_token');
const el = id => document.getElementById(id);
let T = null;            // { items, idx, answers, attemptId, review, score, passed, respMap }

async function api(path, method='GET', body=null){
  const headers = { 'Content-Type':'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch{ data = text; }   // un error en texto plano también se muestra
  if (!res.ok) throw new Error((data && (typeof data === 'string' ? data : (data.error || data.title))) || ('Error ' + res.status));
  return data;
}

// ---- Indicador de carga ----
// setBusy(true, 'Guardando…') enciende la barra de arriba y, con texto, el aviso de abajo;
// es un contador, así que dos esperas a la vez no se apagan una a la otra. btnBusy() pone
// un botón en estado ocupado (deshabilitado, con giro y texto) y devuelve cómo restaurarlo.
let busyN = 0;
function setBusy(on, text){
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  el('busyBar').classList.toggle('on', busyN>0);
  document.body.style.cursor = busyN>0 ? 'progress' : '';
  if(on && text) el('busyText').textContent = text;
  el('busyToast').classList.toggle('on', busyN>0 && !!el('busyText').textContent);
  if(busyN===0) el('busyText').textContent = '';
}
async function whileBusy(text, fn){ setBusy(true, text); try{ return await fn(); } finally{ setBusy(false); } }
function btnBusy(b, text){
  if(!b) return ()=>{};
  const html = b.innerHTML, dis = b.disabled;
  b.classList.add('is-busy'); b.setAttribute('aria-busy','true');
  if(b.tagName==='BUTTON') b.disabled = true;
  b.innerHTML = `<span class="spin"></span>${esc(text)}`;
  return ()=>{ b.classList.remove('is-busy'); b.removeAttribute('aria-busy'); b.innerHTML = html; if(b.tagName==='BUTTON') b.disabled = dis; };
}
function loadingHtml(text){ return `<div class="loading"><span class="spin"></span>${esc(text||'Cargando…')}</div>`; }
// Aviso de error sin bloquear: en modo presentación, el aviso flotante; si no, alert.
function notifyError(e){
  const msg = (e && e.message) || String(e || 'Error');
  if(PRES) presToast(msg, 4000); else alert(msg);
}
// Todo texto del autor o del servidor que se pinta con innerHTML pasa por esc(). El HTML
// de los bloques de texto (b.html, bodyHtml, description) ya llega saneado del servidor.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
// Foto de lámina o de portada: solo data:image/, /media/ o https:.
function safePhoto(u){ return (typeof u==='string' && /^(data:image\/|\/media\/|https:)/i.test(u.trim())) ? u.trim() : ''; }
// El token solo va en las URL del propio /media (nunca a otro servidor).
function mediaSrc(url){ return /^\/media\//.test(url) ? url + (url.includes('?')?'&':'?') + 'access_token=' + encodeURIComponent(token) : url; }
function mediaEl(url,type){
  if(!url || !/^(\/media\/|https:)/i.test(url)) return '';
  const s=esc(mediaSrc(url));
  if(type&&type.indexOf('image')===0) return `<img src="${s}" />`;
  if(type&&type.indexOf('audio')===0) return `<audio controls src="${s}"></audio>`;
  if(type&&type.indexOf('video')===0) return `<video controls src="${s}"></video>`;
  return `<a href="${s}" target="_blank" rel="noopener">📎 Abrir documento</a>`;
}
function blockHtml(b){
  if(b.type==='text') return `<div>${b.html||''}</div>`;
  if(b.type==='media') return mediaEl(b.mediaUrl,b.mediaType);
  return '';
}
// Cuerpo de una pantalla Info (solo los bloques, sin título): lo comparten el modo
// clásico y las láminas del modo presentación.
function infoBody(p){
  let h = '';
  if(Array.isArray(p.blocks)){
    const bl=p.blocks; let i=0;
    while(i<bl.length){
      const b=bl[i];
      if(b.span==='half' && i+1<bl.length && bl[i+1].span==='half'){
        h += `<div class="row2"><div>${blockHtml(b)}</div><div>${blockHtml(bl[i+1])}</div></div>`;
        i+=2;
      } else { h += blockHtml(b); i++; }
    }
  } else { h += mediaEl(p.mediaUrl,p.mediaType) + `<div>${p.bodyHtml||''}</div>`; }
  return h;
}
function renderInfo(p){
  if(isIntroLayout(p)) return introClassicHtml(p);
  let h = p.title ? `<h2>${esc(p.title)}</h2>` : '';
  // Foto de lámina (cover / photo-left): en modo clásico se muestra como una imagen más.
  if(safePhoto(p.photo)) h += `<img src="${esc(safePhoto(p.photo))}" alt="" />`;
  if(Array.isArray(p.blocks)){
    const bl=p.blocks; let i=0;
    while(i<bl.length){
      const b=bl[i];
      if(b.span==='half' && i+1<bl.length && bl[i+1].span==='half'){
        h += `<div class="row2"><div>${blockHtml(b)}</div><div>${blockHtml(bl[i+1])}</div></div>`;
        i+=2;
      } else { h += blockHtml(b); i++; }
    }
  } else { h += mediaEl(p.mediaUrl,p.mediaType) + `<div>${p.bodyHtml||''}</div>`; }
  return h;
}

// ---- Pantalla de entrada (ítem Info con layout 'intro', helper intro() de authoring.mjs) ----
// Solo trae título, descripción, minutos y foto; los demás datos los calcula el reproductor.
// En modo presentación sale de las páginas y dibuja #presStart (ver presBegin); en modo
// clásico y en la revisión de intento se ve como una página más, con caja de resumen.
let passPercent = null;          // umbral de aprobación, solo si la configuración lo trae
function noteCfg(cfg){
  const v = cfg && (cfg.passPercent ?? cfg.PassPercent);
  if(typeof v==='number' && isFinite(v)) passPercent = v;
}
// Tolerante con mayúsculas y espacios en el layout ('Intro', ' intro'): el contenido llega
// de seeds, del editor y de PowerShell, y un layout mal escrito no debe volverlo lámina.
function isIntroLayout(p){ return !!p && typeof p.layout==='string' && p.layout.trim().toLowerCase()==='intro'; }
function introPayload(it){
  if(!it || it.type!=='Info') return null;
  try{ const p=JSON.parse(it.payloadJson); return isIntroLayout(p) ? p : null; }catch{ return null; }
}
function introDescHtml(d){
  d = d || '';
  return /<[a-z][\s\S]*>/i.test(d) ? d : `<p>${esc(d)}</p>`;   // con etiquetas: HTML ya saneado en el servidor
}
// Datos del curso: láminas = pantallas Info sin contar el intro; puntos = suma de Points.
function introStats(p){
  const items = (T && T.items) || [];
  return {
    slides: items.filter(it=>it.type==='Info' && !introPayload(it)).length,
    questions: items.filter(isQuestion).length,
    points: items.reduce((s,it)=>s+(Number(it.points)||0),0),
    pass: passPercent,
    minutes: Number(p.minutes)||0
  };
}
function plural(n, uno, varios){ return n===1 ? uno : varios; }
function introClassicHtml(p){
  const st = introStats(p);
  const row = h => `<div style="margin:4px 0">${h}</div>`;
  const box =
    `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin:16px auto 0;max-width:440px;color:#334155;font-size:14px">` +
    row(`📄 <b>${st.slides} ${plural(st.slides,'pantalla','pantallas')}</b> de contenido`) +
    (st.minutes ? row(`⏱ Duración estimada: <b>${st.minutes} min</b>`) : '') +
    row(`📝 ${st.questions} ${plural(st.questions,'pregunta','preguntas')} (${st.points} puntos)`) +
    (st.pass!=null ? row(`✅ Aprobación: <b>${st.pass}%</b>`) : '') +
    `</div>`;
  const img = safePhoto(p.photo) ? `<img src="${esc(safePhoto(p.photo))}" alt="" style="width:100%;max-height:260px;object-fit:cover" />` : '';
  return `<h1 style="margin:0 0 10px">${esc(p.title)}</h1>${img}<div style="font-size:16px;line-height:1.6">${introDescHtml(p.description)}</div>${box}`;
}
// Mismo contenido para #presStart (y réplica en content/<curso>/seed.mjs --preview).
function introScreenHtml(p, st){
  const cells = [[st.slides, plural(st.slides,'lámina de contenido','láminas de contenido')], [st.questions, plural(st.questions,'pregunta','preguntas')], [st.points, 'puntos']];
  if(st.pass!=null) cells.push([st.pass+' %', 'para aprobar']);
  if(st.minutes) cells.push([st.minutes+' min', 'tiempo estimado']);
  return `<div class="ps-rule"></div><div class="ps-desc">${introDescHtml(p.description)}</div>` +
         `<div class="ps-stats">${cells.map(([v,l])=>`<div class="ps-stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
}
function isQuestion(it){ return it.type==='MultipleChoice' || it.type==='MultiSelect' || it.type==='Matching' || it.type==='OpenResponse'; }
function isAnswered(it){
  const ans=T.answers[it.id]; if(!ans) return false;
  if(it.type==='Matching'){
    let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    const prompts=p.prompts||[]; const m=ans.matches||{};
    return prompts.length>0 && prompts.every(pr=>m[pr.id]);
  }
  if(it.type==='OpenResponse'){ return !!(ans.text && ans.text.trim()); }
  return true;
}
function guard(){ if(!token){ showMsg(`Inicia sesión primero en <a href="/">la página principal</a>.`); return false; } return true; }
// Mensaje a pantalla completa (error o aviso antes de empezar). Si ya se encendió el modo
// presentación, se vuelve a la vista clásica: si no, el mensaje quedaría oculto.
function showMsg(html){ document.body.classList.remove('pres'); el('screen').innerHTML=`<div class="center">${html}</div>`; }
function showError(e){ showMsg(esc(e && e.message || e)); }

// ---------- Tiempo activo (latidos) ----------
function fmtTime(s){
  s=Math.max(0,Math.round(s||0));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m '+sec+'s';
  return sec+'s';
}
let hbTimer=null, hbBound=false;
let allowBack = true;          // opción por curso: permitir volver a la pantalla anterior
let immediateFeedback = false; // opción por curso: ver de inmediato si acertó, o solo al final
// No se revela CUÁL era la opción correcta al instante (eso solo pasa en /review, tras
// aprobar) — solo si acertó o no. Así no se filtra la respuesta correcta a mitad de curso.
function verdictBadge(isCorrect){
  if(isCorrect===null || isCorrect===undefined) return '';
  return isCorrect
    ? '<span style="margin-left:8px;color:var(--ok);font-weight:700">✅ Correcto</span>'
    : '<span style="margin-left:8px;color:var(--err);font-weight:700">❌ Incorrecto</span>';
}
function sendHeartbeat(){
  if(!T || !T.attemptId || T.preview || T.review) return;
  api('/attempts/'+T.attemptId+'/heartbeat','POST').catch(()=>{});
}
function startHeartbeat(){
  if(!T || T.preview || T.review) return;
  sendHeartbeat(); // baseline al entrar (un hueco previo grande se descarta solo)
  hbTimer = setInterval(()=>{ if(document.visibilityState==='visible') sendHeartbeat(); }, 20000);
  // dispara en ambos sentidos: al ocultar acredita el tramo visible; al volver mide la salida
  if(!hbBound){ document.addEventListener('visibilitychange', sendHeartbeat); hbBound=true; }
}
function stopHeartbeat(){ if(hbTimer){ clearInterval(hbTimer); hbTimer=null; } }

// ---------- TAKE ----------
async function startTake(){
  if(!guard()) return;
  if(!versionId){ showMsg(`Falta el adiestramiento.`); return; }
  el('title').textContent = title;
  el('screen').innerHTML = loadingHtml('Cargando adiestramiento…');
  try{
    const s = await api('/versions/'+versionId+'/attempts'+(setId?('?setId='+encodeURIComponent(setId)):''),'POST');
    if(s.pendingCancellation){
      showMsg(`Tienes una <b>cancelación pendiente de aprobación</b> para este curso. No puedes continuar hasta que un revisor la apruebe.`);
      return;
    }
    const useSet = s.setId || setId;
    const items = await api('/versions/'+versionId+'/take'+(useSet?('?setId='+encodeURIComponent(useSet)):''));
    // Opciones del curso: volver atrás, y ver el veredicto de inmediato o solo al final.
    try{
      const cfg = await api('/versions/'+versionId+'/config');
      allowBack = cfg.allowBack !== false;
      immediateFeedback = !!cfg.immediateFeedback;
      noteCfg(cfg);
      presActivate(cfg);
    }catch{ allowBack = true; immediateFeedback = false; }
    el('prevBtn').classList.toggle('hidden', !allowBack);
    if(!items.length){ showMsg(`Este adiestramiento no tiene contenido.`); return; }
    const answers = {}, revealed = {};
    (s.responses||[]).forEach(r=>{
      try{ const a=JSON.parse(r.answerJson);
        if(a.selectedOptionId!==undefined) answers[r.itemId]={type:'single',selectedOptionId:a.selectedOptionId};
        else if(Array.isArray(a.selectedOptionIds)) answers[r.itemId]={type:'multi',selectedOptionIds:a.selectedOptionIds};
        else if(a.matches) answers[r.itemId]={type:'match',matches:a.matches};
        else if(typeof a.text==='string') answers[r.itemId]={type:'open',text:a.text};
      }catch{}
      if(r.isCorrect!==null && r.isCorrect!==undefined) revealed[r.itemId]=r.isCorrect;
    });
    const pages = buildPages(items);
    const intro = presTakeIntro(pages);   // antes de indexar páginas: en modo presentación no es una lámina
    const revealedPages = {};
    // Si se reanuda un intento, bloquea de una vez las páginas cuyas preguntas
    // calificables ya se contestaron — así no se puede aprovechar para cambiarlas
    // después de haber visto (o poder ver) el veredicto.
    if(immediateFeedback) pages.forEach((pg,i)=>{
      const checkable = pg.items.filter(it=>isQuestion(it) && it.type!=='OpenResponse');
      if(checkable.length>0 && checkable.every(it=>revealed[it.id]!==undefined)) revealedPages[i]=true;
    });
    T = { attemptId:s.attemptId, items, pages, idx:0, answers, revealed, revealedPages, review:false, intro };
    // Modo presentación con pantalla de entrada: un intento en progreso se retoma en la
    // lámina donde iba (la entrada lo anuncia con «Continuar»). Sin ítem intro se arranca
    // en la primera página, como siempre.
    if(PRES && intro) T.idx = presResumeIdx(s.attemptId, pages, answers);
    el('nav').style.display='flex';
    presBegin();
    renderStep();
    startHeartbeat();
  }catch(e){ showError(e); }
}

function questionCount(){ return T.items.filter(isQuestion).length; }
function answeredCount(){ return T.items.filter(it=>isQuestion(it)&&isAnswered(it)).length; }
// Solo las preguntas marcadas como requeridas bloquean el botón Finalizar.
function isRequiredQ(it){ return isQuestion(it) && it.required!==false; }
function pendingRequired(){ return T.items.filter(it=>isRequiredQ(it)&&!isAnswered(it)).length; }
function canFinish(){ if(T.preview) return true; return pendingRequired()===0; }

// ---- Páginas: ítems consecutivos marcados "samePage" comparten una sola pantalla ----
// La pantalla de entrada (intro) va siempre sola en su página: ni se une a la anterior ni
// deja que la siguiente se le una, para que el modo presentación pueda sacarla entera.
function buildPages(items){
  const pages=[]; let curMod='';
  for(const it of items){
    let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    if(it.type==='ModuleHeader') curMod = p.title||'';
    const intro = it.type==='Info' && isIntroLayout(p);
    const sp = !!p.samePage;
    const last = pages[pages.length-1];
    if(sp && !intro && it.type!=='ModuleHeader' && last && !last.intro) last.items.push(it);
    else pages.push({ items:[it], module:curMod, intro });
  }
  return pages;
}
function setModuleHeader(){ el('moduleLabel').textContent = (T.pages && T.idx < T.pages.length) ? (T.pages[T.idx].module||'') : ''; }

function renderStep(){
  const N=T.pages.length;
  if(PRES){
    presShow(T.idx < N ? presPageHtml(T.pages[T.idx]) : presSummaryHtml(), T.idx - (T.lastIdx ?? T.idx));
  } else if(T.idx < N){
    el('screen').innerHTML = T.pages[T.idx].items.map((it,i)=>{
      const sep = i>0 ? 'border-top:1px solid #e2e8f0;margin-top:18px;padding-top:18px' : '';
      return `<div style="${sep}">${itemHtml(it)}</div>`;
    }).join('');
  } else renderSummary();
  T.lastIdx = T.idx;
  if(PRES) presSavePos();
  setModuleHeader();
  const total=N+1;
  el('progressText').textContent = `Página ${T.idx+1} de ${total}`;
  el('progressBar').style.width = Math.round((T.idx+1)/total*100)+'%';
  el('prevBtn').disabled = T.idx===0;
  const last = T.idx===N;
  el('nextBtn').classList.toggle('hidden', last);
  if(!last) el('nextBtn').textContent = (immediateFeedback && T.revealedPages[T.idx]) ? 'Continuar ▸' : 'Siguiente ▸';
  if(last){
    el('finishBtn').classList.remove('hidden');
    el('finishBtn').textContent = T.repaso ? 'Cerrar' : (T.preview ? 'Cerrar (vista previa)' : 'Finalizar');
    el('finishBtn').disabled = !canFinish();
  } else { el('finishBtn').classList.add('hidden'); }
  if(PRES) presChrome();
  window.scrollTo(0,0);
}

function itemHtml(it){
  let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
  if(it.type==='ModuleHeader'){
    return `<div class="module"><span class="tag">Módulo</span><h1 style="margin:14px 0 8px">${esc(p.title)}</h1><p style="color:#475569">${esc(p.subtitle)}</p></div>`;
  } else if(it.type==='Info'){
    return renderInfo(p);
  } else if(it.type==='MultipleChoice'){
    const sel=(T.answers[it.id]||{}).selectedOptionId; const nm='w_'+it.id;
    const locked = immediateFeedback && T.revealed[it.id]!==undefined;
    return `<b>${esc(p.question)}</b>${locked?verdictBadge(T.revealed[it.id]):''}${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px">`+
      (p.options||[]).map(o=>`<label class="opt"><input type="radio" name="${nm}" value="${esc(o.id)}" ${sel===o.id?'checked':''} ${locked?'disabled':''}/> ${esc(o.text)}</label>`).join('')+`</div>`;
  } else if(it.type==='MultiSelect'){
    const sel=((T.answers[it.id]||{}).selectedOptionIds)||[]; const nm='w_'+it.id;
    const locked = immediateFeedback && T.revealed[it.id]!==undefined;
    return `<b>${esc(p.question)}</b> <span style="color:#64748b;font-size:13px">(varias correctas)</span>${locked?verdictBadge(T.revealed[it.id]):''}${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px">`+
      (p.options||[]).map(o=>`<label class="opt"><input type="checkbox" name="${nm}" value="${esc(o.id)}" ${sel.indexOf(o.id)>=0?'checked':''} ${locked?'disabled':''}/> ${esc(o.text)}</label>`).join('')+`</div>`;
  } else if(it.type==='Matching'){
    const saved=((T.answers[it.id]||{}).matches)||{};
    const choices=p.choices||[];
    const locked = immediateFeedback && T.revealed[it.id]!==undefined;
    const rows=(p.prompts||[]).map(pr=>`
      <div class="matchrow"><div class="mp">${esc(pr.text)}</div>
        <select class="match" data-item="${it.id}" data-pid="${esc(pr.id)}" ${locked?'disabled':''}>
          <option value="">— elige —</option>
          ${choices.map(c=>`<option value="${esc(c.id)}" ${saved[pr.id]===c.id?'selected':''}>${esc(c.text)}</option>`).join('')}
        </select></div>`).join('');
    return `<b>${esc(p.question)}</b> <span style="color:#64748b;font-size:13px">(empareja cada uno)</span>${locked?verdictBadge(T.revealed[it.id]):''}${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px">${rows}</div>`;
  } else if(it.type==='OpenResponse'){
    const saved=((T.answers[it.id]||{}).text)||'';
    const note = p.graded ? ' <span style="color:#64748b;font-size:13px">(la evaluará el moderador)</span>' : ' <span style="color:#64748b;font-size:13px">(respuesta abierta)</span>';
    return `<b>${esc(p.question)}</b>${note}${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px"><textarea id="open_${it.id}" class="opentext" placeholder="Escribe tu respuesta…">${saved.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea></div>`;
  }
  return '';
}

function summaryRows(){
  return T.items.map(it=>{
    let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    if(it.type==='ModuleHeader') return `<div class="sumrow">📂 Módulo: ${esc(p.title)}</div>`;
    if(it.type==='Info' && isIntroLayout(p)) return '';   // la pantalla de entrada no es contenido
    if(it.type==='Info') return `<div class="sumrow">📄 ${esc(p.title||'Contenido')}</div>`;
    const answered = !T.review && isAnswered(it);
    const mk = T.review ? '' : `<span class="st">${answered?'✓ contestada':'✗ sin contestar'}</span>`;
    return `<div class="sumrow">❓ ${esc(p.question||'Pregunta')} ${mk}</div>`;
  }).join('');
}

// Pie del resumen (resultado en revisión, aviso de vista previa o de preguntas pendientes).
function summaryFoot(){
  if(T.review){
    const pct=T.totalPts?Math.round(T.score*100/T.totalPts):100;
    return `<div class="res ${T.passed?'pass':'fail'}">${T.passed?'✅ Aprobado':'❌ No aprobado'} — ${T.score} pts (${pct}%)</div>
      <div style="color:#64748b;font-size:13px;margin-top:8px;text-align:center">⏱️ Tiempo en el curso: ${fmtTime(T.activeSeconds)}</div>
      <div class="actions"><button class="btn ghost" onclick="window.close()">Cerrar pestaña</button></div>`;
  }
  if(T.preview) return `<div class="hintbox">Vista previa — así verá el learner el curso. No se registra ningún intento.</div>`;
  if(pendingRequired()>0) return `<div class="hintbox">Te faltan preguntas obligatorias por contestar. Usa “Anterior” para volver y completarlas; el botón Finalizar se activará cuando todas estén contestadas.</div>`;
  return '';
}
function renderSummary(){
  el('screen').innerHTML=`<h2>Resumen del adiestramiento</h2><div style="margin-top:6px">${summaryRows()}</div>${summaryFoot()}`;
}

async function persistCurrent(){
  const page = (T.pages && T.idx<T.pages.length) ? T.pages[T.idx].items : [];
  for(const it of page){
    // Ya se reveló (feedback inmediato) — no se vuelve a mandar, los campos están bloqueados.
    // (T.revealed no existe en preview/repaso, que no llaman a la API igual.)
    if(T.revealed && T.revealed[it.id]!==undefined) continue;
    if(it.type==='MultipleChoice'){
      const v=(document.querySelector('input[name="w_'+it.id+'"]:checked')||{}).value;
      if(v){ T.answers[it.id]={type:'single',selectedOptionId:v};
        if(!T.preview){ const r=await api('/attempts/'+T.attemptId+'/answer','POST',{ itemId:it.id, answerJson:JSON.stringify({selectedOptionId:v}) }); T.revealed[it.id]=r.isCorrect; } }
    } else if(it.type==='MultiSelect'){
      const vs=[...document.querySelectorAll('input[name="w_'+it.id+'"]:checked')].map(x=>x.value);
      if(vs.length){ T.answers[it.id]={type:'multi',selectedOptionIds:vs};
        if(!T.preview){ const r=await api('/attempts/'+T.attemptId+'/answer','POST',{ itemId:it.id, answerJson:JSON.stringify({selectedOptionIds:vs}) }); T.revealed[it.id]=r.isCorrect; } }
    } else if(it.type==='Matching'){
      const m={}; document.querySelectorAll('select.match[data-item="'+it.id+'"]').forEach(s=>{ if(s.value) m[s.dataset.pid]=s.value; });
      T.answers[it.id]={type:'match',matches:m};
      if(!T.preview && Object.keys(m).length){ const r=await api('/attempts/'+T.attemptId+'/answer','POST',{ itemId:it.id, answerJson:JSON.stringify({matches:m}) }); T.revealed[it.id]=r.isCorrect; }
    } else if(it.type==='OpenResponse'){
      const v=(document.getElementById('open_'+it.id)||{}).value||'';
      T.answers[it.id]={type:'open',text:v};
      if(!T.preview && v.trim()) await api('/attempts/'+T.attemptId+'/answer','POST',{ itemId:it.id, answerJson:JSON.stringify({text:v}) });
    }
  }
}

// Con feedback inmediato activado, la primera vez que se sale de una página con
// preguntas calificables (todas menos OpenResponse) hay que "revelar" el veredicto
// antes de dejar avanzar: se contesta, se muestra ✅/❌ por pregunta (nunca cuál era
// la opción correcta) y la página queda bloqueada — un segundo clic sí avanza.
// Guardar las respuestas de la página va al servidor: mientras tanto se ve la barra de
// carga y el aviso «Guardando respuesta…», y los botones de navegación quedan ocupados
// (sin doble clic). Si falla, se avisa y se queda en la misma página.
let saving = false;
function pageHasQuestions(){ return !!(T.pages && T.idx<T.pages.length && T.pages[T.idx].items.some(isQuestion)); }
async function saveCurrent(){
  if(T.review) return true;
  if(T.preview || !pageHasQuestions()){ await persistCurrent(); return true; }
  saving = true;
  const navBtns = ['prevBtn','nextBtn','presPrev','presNext'].map(el);
  const prev = navBtns.map(b=>b.disabled);
  navBtns.forEach(b=>{ b.disabled = true; b.classList.add('is-busy'); });
  setBusy(true, 'Guardando respuesta…');
  try{ await persistCurrent(); return true; }
  catch(e){ notifyError(e); return false; }
  finally{
    setBusy(false); saving = false;
    navBtns.forEach((b,i)=>{ b.classList.remove('is-busy'); b.disabled = prev[i]; });
  }
}
async function goPrev(){ if(saving) return; if(!await saveCurrent()) return; if(T.idx>0){ T.idx--; renderStep(); } }
async function goNext(){
  if(saving) return;
  if(!T.review){
    const page = (T.pages && T.idx<T.pages.length) ? T.pages[T.idx].items : [];
    const checkable = page.filter(it=>isQuestion(it) && it.type!=='OpenResponse');
    const needsCheck = immediateFeedback && checkable.length>0 && !T.revealedPages[T.idx];
    if(!await saveCurrent()) return;
    if(needsCheck){ T.revealedPages[T.idx]=true; renderStep(); return; }
  }
  if(T.idx<T.pages.length){ T.idx++; renderStep(); }
}
el('prevBtn').onclick = goPrev;
el('nextBtn').onclick = goNext;
// Pantalla final (resultado): en modo presentación va como lámina; si no, al panel de siempre.
function showFinal(html){
  if(PRES){ presShow(`<div class="sl sl-dark sl-final"><h1 class="sl-kicker">${esc(panelTitle())}</h1><div class="sl-rule"></div><div class="sl-body"><div class="sl-fit">${html}</div></div></div>`, 1); presChrome(true); }
  else el('screen').innerHTML=html;
}
// «Descargar certificado» abre certificate.html en otra pestaña (que muestra su propio
// «Cargando certificado…»); aquí el botón queda ocupado un momento para que se note el clic.
function certClick(a){
  if(a.classList.contains('is-busy')) return false;
  const restore = btnBusy(a, 'Abriendo certificado…');
  setTimeout(restore, 2500);
  return true;
}
let finishing = false;
el('finishBtn').onclick = async () => {
  if(T.preview){ window.close(); return; }
  if(!canFinish() || finishing || saving) return;
  finishing = true;
  // Los dos botones «Finalizar» (barra clásica y lámina de resumen) quedan ocupados.
  const restores = [btnBusy(el('finishBtn'), 'Finalizando…'), btnBusy(el('presFinishBtn'), 'Finalizando…')];
  setBusy(true, 'Calificando y guardando tu resultado…');
  stopHeartbeat();
  try{
    const r=await api('/attempts/'+T.attemptId+'/complete','POST');
    try{ localStorage.removeItem('tp_pos_'+T.attemptId); }catch{}
    const tiempo = `<div class="tiempo" style="color:#64748b;font-size:13px;margin-top:8px;text-align:center">⏱️ Tiempo en el curso: ${fmtTime(r.activeSeconds)}</div>`;
    const cerrar = `<button class="btn ghost" onclick="window.close()">Cerrar pestaña</button>`;
    if(r.pendingGrading || r.status==='pending-grading'){
      showFinal(`<div class="res" style="background:#fef9c3;color:#854d0e">📝 Respuestas enviadas<br>Tienes preguntas abiertas pendientes de evaluación del moderador. Tu resultado final aparecerá cuando las califiquen.</div>${tiempo}
        <div class="actions">${cerrar}</div>`);
    } else {
      const pct=r.total?Math.round(r.score*100/r.total):100;
      const cert = (r.passed && r.certificateSerial)
        ? `<a class="btn" style="text-decoration:none" href="/certificate.html?attempt=${T.attemptId}" target="_blank" rel="noopener" onclick="return certClick(this)">📜 Descargar certificado</a>`
        : '';
      showFinal(`<div class="res ${r.passed?'pass':'fail'}">${r.passed?'✅ Aprobado':'❌ No aprobado'}<br>${r.score} / ${r.total} puntos (${pct}%)</div>${tiempo}
        <div class="actions">${cert}${cerrar}</div>`);
    }
    el('nav').style.display='none'; el('progressBar').style.width='100%';
  }catch(e){
    restores.forEach(f=>f());
    startHeartbeat();
    notifyError(e);
  }finally{ finishing = false; setBusy(false); }
};

// ---------- REVIEW (read-only) ----------
async function startReview(){
  if(!guard()) return;
  el('title').textContent = title + ' · revisión';
  try{
    const d = await api('/attempts/'+reviewId+'/review');
    const respMap={}; (d.responses||[]).forEach(r=>respMap[r.itemId]=r);
    let totalPts=0; (d.items||[]).forEach(i=>totalPts+=i.points||0);
    T = { items:d.items, pages:buildPages(d.items), idx:0, review:true, score:d.score, passed:d.passed, respMap, totalPts, answers:respMap, activeSeconds:d.activeSeconds };
    el('nav').style.display='flex';
    el('finishBtn').classList.add('hidden');
    renderStepReview();
  }catch(e){ showError(e); }
}
function renderStepReview(){
  const N=T.pages.length;
  if(T.idx<N){
    el('screen').innerHTML = T.pages[T.idx].items.map((it,i)=>{
      const sep = i>0 ? 'border-top:1px solid #e2e8f0;margin-top:18px;padding-top:18px' : '';
      return `<div style="${sep}">${itemReviewHtml(it)}</div>`;
    }).join('');
  } else renderSummary();
  setModuleHeader();
  const total=N+1;
  el('progressText').textContent=`Página ${T.idx+1} de ${total}`;
  el('progressBar').style.width=Math.round((T.idx+1)/total*100)+'%';
  el('prevBtn').disabled=T.idx===0;
  el('nextBtn').classList.toggle('hidden', T.idx===N);
  window.scrollTo(0,0);
}
function itemReviewHtml(it){
  let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
  if(it.type==='ModuleHeader'){ return `<div class="module"><span class="tag">Módulo</span><h1 style="margin:14px 0 8px">${esc(p.title)}</h1><p style="color:#475569">${esc(p.subtitle)}</p></div>`; }
  if(it.type==='Info'){ return renderInfo(p); }
  const resp=T.respMap[it.id]; let ans={}; try{ ans=resp?JSON.parse(resp.answerJson):{}; }catch{}
  if(it.type==='Matching'){
    const m=ans.matches||{};
    const choiceText=id=>{ const c=(p.choices||[]).find(x=>x.id===id); return esc(c?c.text:'—'); };
    const rows=(p.prompts||[]).map(pr=>{
      const sel=m[pr.id]; const corr=pr.correctChoiceId; const ok=sel&&sel===corr;
      const detail = ok ? `${choiceText(sel)} ✔` : `${sel?choiceText(sel):'(sin responder)'} · correcta: ${choiceText(corr)}`;
      return `<div class="matchrow"><div class="mp">${esc(pr.text)}</div><div class="opt ${ok?'correct':'wrong'}" style="flex:1">${detail}</div></div>`;
    }).join('');
    const verdict = resp && resp.isCorrect ? '✅' : (resp ? '❌' : '—');
    return `<b>${esc(p.question)}</b> <span style="color:#64748b">${verdict}</span>${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px">${rows}</div>`;
  }
  if(it.type==='OpenResponse'){
    const txt=(ans.text||'(sin respuesta)');
    let box='';
    if(p.graded){
      if(resp && resp.needsGrading) box=`<div class="hintbox">Pendiente de evaluación del moderador.</div>`;
      else box=`<div class="opt correct">Puntos otorgados: ${resp?resp.pointsAwarded:0}${(resp&&resp.graderComment)?` · ${esc(resp.graderComment)}`:''}</div>`;
    }
    return `<b>${esc(p.question)}</b>${mediaEl(p.mediaUrl,p.mediaType)}<div class="opentext-ro">${txt.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>${box}`;
  }
  const correctIds = it.type==='MultiSelect' ? (p.correctOptionIds||[]) : (p.correctOptionId?[p.correctOptionId]:[]);
  const selIds = it.type==='MultiSelect' ? (ans.selectedOptionIds||[]) : (ans.selectedOptionId?[ans.selectedOptionId]:[]);
  const opts=(p.options||[]).map(o=>{
    const isCorrect=correctIds.indexOf(o.id)>=0;
    const isSel=selIds.indexOf(o.id)>=0;
    let cls='opt'; if(isCorrect) cls+=' correct'; else if(isSel) cls+=' wrong';
    let mk=''; if(isCorrect) mk='✔ correcta'; if(isSel) mk += (mk?' · ':'')+'tu respuesta';
    return `<div class="${cls}">${esc(o.text)}<span class="mk">${mk}</span></div>`;
  }).join('');
  const verdict = resp && resp.isCorrect ? '✅' : (resp ? '❌' : '—');
  return `<b>${esc(p.question)}</b> <span style="color:#64748b">${verdict}</span>${mediaEl(p.mediaUrl,p.mediaType)}<div style="margin-top:10px">${opts}</div>`;
}

// ---------- PREVIEW (author, no attempt) ----------
async function startPreview(){
  if(!guard()) return;
  if(!previewId){ showMsg(`Falta la versión.`); return; }
  el('title').textContent = title + ' · vista previa';
  try{
    const items = await api('/versions/'+previewId+'/preview');
    if(!items.length){ showMsg(`Este adiestramiento no tiene contenido todavía.`); return; }
    try{ const cfg = await api('/versions/'+previewId+'/config'); noteCfg(cfg); presActivate(cfg); }catch{}
    const pages = buildPages(items), intro = presTakeIntro(pages);
    T = { items, pages, idx:0, answers:{}, revealed:{}, revealedPages:{}, review:false, preview:true, intro };
    el('nav').style.display='flex';
    presBegin();
    renderStep();
  }catch(e){ showError(e); }
}

// ---------- REPASO (learner, curso ya aprobado: sin intento ni puntuación) ----------
async function startRepaso(){
  if(!guard()) return;
  el('title').textContent = title + ' · repaso';
  try{
    const items = await api('/versions/'+repasoId+'/take'+(setId?('?setId='+encodeURIComponent(setId)):''));
    if(!items.length){ showMsg(`Este adiestramiento no tiene contenido.`); return; }
    try{ const cfg = await api('/versions/'+repasoId+'/config'); noteCfg(cfg); presActivate(cfg); }catch{}
    const pages = buildPages(items), intro = presTakeIntro(pages);
    T = { items, pages, idx:0, answers:{}, revealed:{}, revealedPages:{}, review:false, preview:true, repaso:true, intro };
    el('nav').style.display='flex';
    el('prevBtn').classList.remove('hidden');   // en repaso siempre se puede ir y venir
    presBegin();
    renderStep();
  }catch(e){ showError(e); }
}

// ---------- MODO PRESENTACIÓN ----------
// Se enciende solo si /versions/{id}/config trae presentation.enabled. Cada página se
// dibuja como una lámina de 1280×720 dentro de #presStage, que se escala a la ventana;
// el header, la barra de progreso y la barra de botones se ocultan y quedan el contador,
// dos flechas (se atenúan a los 2 s sin mover el ratón) y el teclado. Sin este bloque
// activo, nada de lo de arriba cambia de comportamiento.
let PRES = null;                 // { theme:{bg,accent,panel,panelTitle}, transition }
let presCur = null;              // lámina actualmente visible dentro de #presLayer
let navLock = false;             // evita avanzar dos páginas con dos teclas seguidas
const motionOk = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function presActivate(cfg){
  const p = cfg && cfg.presentation;
  if(!p || !p.enabled || PRES) return;
  PRES = {
    theme: Object.assign({ bg:'#0d0d0d', accent:'#f97316', panel:true, panelTitle:'' }, p.theme||{}),
    transition: ['cover','fade','none'].includes(p.transition) ? p.transition : 'cover'
  };
  document.documentElement.style.setProperty('--pbg', PRES.theme.bg);
  document.documentElement.style.setProperty('--pacc', PRES.theme.accent);
  document.body.classList.add('pres');
  presFit(); window.addEventListener('resize', presFit);
  el('presPrev').onclick = ()=>presNav(goPrev);
  el('presNext').onclick = ()=>presNav(goNext);
  presWake();
}
// Escala a la ventana y centra en píxeles enteros (ver .pstage).
function presFit(){
  const st = el('presStage'), k = Math.min(innerWidth/1280, innerHeight/720);
  st.style.setProperty('--pk', k);
  st.style.setProperty('--px', Math.round((innerWidth - 1280*k)/2)+'px');
  st.style.setProperty('--py', Math.round((innerHeight - 720*k)/2)+'px');
}
function panelTitle(){ return ((PRES && PRES.theme.panelTitle) || '').trim() || title.toUpperCase(); }

// El ítem 'intro' sale de las páginas: la portada queda como lámina 1 y el contador
// «n / N» no lo cuenta. Devuelve su payload, o null. Lo normal es que sea el primer ítem,
// pero se busca en todas las páginas (buildPages lo deja siempre solo en la suya): así un
// ítem sobrante delante o un intro repetido no lo convierten en una lámina casi vacía. Si
// hubiera más de uno, se usa el primero y se quitan todos. Sin modo presentación no se
// toca nada: el intro se ve como una página más (introClassicHtml).
function presTakeIntro(pages){
  if(!PRES || !pages.length) return null;
  let found = null;
  for(let i=pages.length-1; i>=0; i--){
    const pg = pages[i];
    const p = (pg.intro || pg.items.length===1) ? introPayload(pg.items[0]) : null;
    if(p){ found = p; pages.splice(i,1); }
  }
  return found;
}
// Lámina donde retomar un intento en progreso (solo cursos con pantalla de entrada): la
// última guardada en este navegador o, si las respuestas del servidor van más adelante
// (otro equipo), la siguiente a la última página con alguna pregunta contestada. Nunca
// pasa del resumen (índice = nº de páginas).
function presResumeIdx(attemptId, pages, answers){
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem('tp_pos_'+attemptId)||'0',10) || 0; }catch{}
  let last = -1;
  pages.forEach((pg,i)=>{ if(pg.items.some(it=>isQuestion(it) && answers[it.id])) last = i; });
  return Math.max(0, Math.min(pages.length, Math.max(saved, last+1)));
}
function presSavePos(){
  if(!T || !T.intro || !T.attemptId || T.preview || T.review) return;
  try{ localStorage.setItem('tp_pos_'+T.attemptId, String(T.idx)); }catch{}
}
function firstCoverPhoto(){
  for(const pg of T.pages) for(const it of pg.items){
    if(it.type!=='Info') continue;
    let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    if(p.layout==='cover' && safePhoto(p.photo)) return safePhoto(p.photo);
  }
  return '';
}

// Pantalla de inicio: pide pantalla completa (si el navegador lo niega, sigue igual).
// Con ítem 'intro' muestra además la foto de portada atenuada, la descripción y los datos
// del curso; al retomar un intento el botón dice «Continuar» e indica la lámina.
function presBegin(){
  if(!PRES) return;
  const intro = T && T.intro;
  el('presStart').classList.toggle('intro', !!intro);
  el('presStartTitle').textContent = (intro && intro.title) || title;
  const photo = intro ? (safePhoto(intro.photo) || firstCoverPhoto()) : '';
  if(photo) el('presStartPhoto').src = photo;
  el('presStartPhoto').classList.toggle('hidden', !photo);
  el('presStartShade').classList.toggle('hidden', !photo);
  el('presStartIntro').innerHTML = intro ? introScreenHtml(intro, introStats(intro)) : '';
  el('presStartIntro').classList.toggle('hidden', !intro);
  el('presStartHelp').classList.toggle('hidden', !!intro);
  el('presStartHint').classList.toggle('hidden', !intro);
  const resume = !!intro && T.idx>0;
  el('presStartBtn').textContent = resume ? 'Continuar' : 'Comenzar';
  el('presStartResume').textContent = resume ? `Vas por la lámina ${T.idx+1} de ${T.pages.length+1}` : '';
  el('presStartResume').classList.toggle('hidden', !resume);
  el('presStart').classList.remove('hidden');
  el('presStartBtn').onclick = ()=>{
    try{ const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r && r.catch) r.catch(()=>{}); }catch{}
    el('presStart').classList.add('hidden');
    presWake();
  };
}

async function presNav(fn){ if(navLock || !T) return; navLock=true; try{ await fn(); } finally{ navLock=false; } }

// Contador «4 / 21» y flechas según la página; `final` = ya se mostró el resultado.
function presChrome(final){
  const N = T.pages.length;
  el('presCounter').textContent = final ? '' : `${T.idx+1} / ${N+1}`;
  const canPrev = !final && T.idx>0 && !el('prevBtn').classList.contains('hidden');
  el('presPrev').classList.toggle('hidden', !canPrev);
  el('presNext').classList.toggle('hidden', !!final || T.idx>=N);
}

let idleTimer=null;
function presWake(){
  el('presRoot').classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>el('presRoot').classList.add('idle'), 2000);
}
document.addEventListener('mousemove', ()=>{ if(PRES) presWake(); });

let toastTimer=null;
function presToast(msg, ms){
  const t=el('presToast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms||1800);
}

// Enter/Espacio solo avanzan si la(s) pregunta(s) de la lámina ya tienen respuesta
// (se lee del DOM, igual que persistCurrent). Las flechas se comportan como «Siguiente».
function pageAnswered(){
  if(T.idx>=T.pages.length) return true;
  for(const it of T.pages[T.idx].items){
    if(!isQuestion(it)) continue;
    if(T.revealed && T.revealed[it.id]!==undefined) continue;
    if(it.type==='MultipleChoice' || it.type==='MultiSelect'){
      if(!document.querySelector('input[name="w_'+it.id+'"]:checked')) return false;
    } else if(it.type==='Matching'){
      if([...document.querySelectorAll('select.match[data-item="'+it.id+'"]')].some(s=>!s.value)) return false;
    } else if(it.type==='OpenResponse'){
      if(!((document.getElementById('open_'+it.id)||{}).value||'').trim()) return false;
    }
  }
  return true;
}
document.addEventListener('keydown', e=>{
  if(!PRES || !T) return;
  if(!el('presStart').classList.contains('hidden')){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el('presStartBtn').click(); }
    return;
  }
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='textarea' || tag==='select' || tag==='button' || tag==='a') return;
  if(tag==='input' && (e.target.type==='text' || e.key===' ')) return;   // espacio sobre un radio lo marca
  const fwd = ['ArrowRight','ArrowDown',' ','Enter','PageDown'], back = ['ArrowLeft','ArrowUp','PageUp'];
  if(fwd.includes(e.key)){
    e.preventDefault();
    if(T.idx>=T.pages.length) return;                       // en el resumen se termina con el botón
    if((e.key===' ' || e.key==='Enter') && !pageAnswered()){ presToast('Contesta para continuar'); return; }
    presNav(goNext);
  } else if(back.includes(e.key)){
    e.preventDefault();
    if(!el('presPrev').classList.contains('hidden')) presNav(goPrev);
  }
  // Esc: el navegador sale de pantalla completa por su cuenta; el intento sigue abierto.
});

// ---- Láminas ----
function slideWrap(cls, chrome, body, style){
  return `<div class="sl ${cls}"${style?` style="${style}"`:''}>${chrome}<div class="sl-body"><div class="sl-fit">${body}</div></div></div>`;
}
function presInfoSlide(p){
  const layout = p.layout || 'dark';
  const body = infoBody(p);
  const tt = p.title ? `<h2>${esc(p.title)}</h2>` : '';
  // presTakeIntro saca el intro de las páginas; esto queda solo como red de seguridad.
  if(isIntroLayout(p))
    return slideWrap('sl-dark', `<h1 class="sl-kicker">${esc(panelTitle())}</h1><div class="sl-rule"></div>`, (p.title?`<h3>${esc(p.title)}</h3>`:'')+introDescHtml(p.description));
  if(layout==='cover')
    return slideWrap('sl-cover', `<img class="cover-photo" src="${esc(safePhoto(p.photo))}" alt="" /><div class="cover-band"><h1>${esc(p.title)}</h1></div>`, body);
  if(layout==='photo-left')
    return slideWrap('sl-photo', `<img class="photo" src="${esc(safePhoto(p.photo))}" alt="" /><h1 class="sl-kicker">${esc(p.kicker||panelTitle())}</h1><div class="sl-rule"></div>`,
                     tt+body, p.photoPos ? `--ppos:${esc(String(p.photoPos).replace(/[^\w%.\s-]/g, ''))}` : '');
  if(layout==='split'){
    const v = (p.variant==='right' || p.variant==='lines') ? ' '+p.variant : '';
    const np = PRES.theme.panel===false ? ' no-panel' : '';
    return slideWrap('sl-split'+v+np, `<div class="panel"></div><h1 class="ptitle">${esc(panelTitle())}</h1>${np?`<div class="sl-kicker">${esc(panelTitle())}</div>`:''}`, tt+body);
  }
  // dark: el título va en el cuerpo como subtítulo en mayúsculas, salvo que el cuerpo ya traiga uno.
  const sub = (p.title && !/<h3[\s>]/i.test(body)) ? `<h3>${esc(p.title)}</h3>` : '';
  return slideWrap('sl-dark', `<h1 class="sl-kicker">${esc(p.kicker||panelTitle())}</h1><div class="sl-rule"></div>`, sub+body);
}
function qNumber(it){ return T.items.filter(isQuestion).indexOf(it)+1; }
function presPageHtml(page){
  const items = page.items;
  if(items.length===1){
    const it=items[0]; let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    if(it.type==='Info') return presInfoSlide(p);
    if(it.type==='ModuleHeader')
      return slideWrap('sl-dark sl-mod', `<h1 class="sl-kicker">${esc(p.title)}</h1><div class="sl-rule"></div>`, `<p>${esc(p.subtitle)}</p>`);
  }
  // Pregunta(s) — o varios ítems en la misma página: lámina oscura con marco de acento.
  const qs = items.filter(isQuestion);
  const kicker = qs.length ? 'Pregunta '+qNumber(qs[0])+(qs.length>1?` – ${qNumber(qs[qs.length-1])}`:'') : panelTitle();
  const body = items.map(it=>`<div class="qwrap">${itemHtml(it)}</div>`).join('');
  return slideWrap('sl-dark sl-q', `<div class="sl-frame"></div><h1 class="sl-kicker">${esc(kicker)}</h1><div class="sl-rule"></div>`, body);
}
function presSummaryHtml(){
  const rows = T.items.filter(isQuestion).map(it=>{
    let p={}; try{ p=JSON.parse(it.payloadJson); }catch{}
    const ok = isAnswered(it);
    return `<div class="sumrow">${ok?'✓':'✗'} ${esc(p.question||'Pregunta')}<span class="st">${ok?'contestada':'sin contestar'}</span></div>`;
  }).join('');
  let actions='';
  if(!T.review){
    const label = T.repaso ? 'Cerrar' : (T.preview ? 'Cerrar (vista previa)' : 'Finalizar');
    // «Volver» a la izquierda y la acción principal a la derecha, el par centrado.
    actions = `<div class="actions">` +
              (el('prevBtn').classList.contains('hidden') ? '' : `<button class="pbtn ghost" onclick="presNav(goPrev)">Volver</button>`) +
              `<button class="pbtn" id="presFinishBtn" onclick="el('finishBtn').click()" ${canFinish()?'':'disabled'}>${label}</button></div>`;
  }
  return slideWrap('sl-dark sl-sum', `<h1 class="sl-kicker">Resumen del adiestramiento</h1><div class="sl-rule"></div>`,
    `<p>${answeredCount()} de ${questionCount()} preguntas contestadas.</p><div class="sumgrid">${rows}</div>${summaryFoot()}${actions}`);
}

// Marco de una lámina: lo que queda igual entre dos láminas seguidas del mismo tipo. Para
// split es el layout, la variante y el título del panel; para la oscura de contenido, el
// encabezado (kicker). Preguntas, módulos, portadas y fotos no comparten marco ('').
function presFrameKey(s){
  const sl = s.firstElementChild;
  if(!sl || !sl.classList.contains('sl')) return '';
  if(sl.classList.contains('sl-split')){
    const t = sl.querySelector('.ptitle');
    return 'split|' + sl.className + '|' + (t ? t.textContent : '');
  }
  if(sl.classList.contains('sl-dark') && !sl.classList.contains('sl-q') && !sl.classList.contains('sl-mod') &&
     !sl.classList.contains('sl-sum') && !sl.classList.contains('sl-final')){
    const k = sl.querySelector(':scope > .sl-kicker');
    return 'dark|' + sl.className + '|' + (k ? k.textContent : '');
  }
  return '';
}

// Mete la lámina nueva en el escenario con la transición configurada. dir>0 avanza,
// dir<0 retrocede, 0 = misma página (p. ej. al revelar el veredicto): sin animación.
// Si la nueva comparte marco con la anterior (presFrameKey), el marco no se mueve: la
// nueva la cubre al instante y solo entra su contenido. Una transición a medias se
// termina en seco antes de empezar la siguiente, y la lámina saliente se retira siempre
// (transitionend/animationend, con respaldo por tiempo).
let presTx = null;               // transición en curso: { finish }
function presShow(html, dir){
  const layer = el('presLayer');
  if(presTx) presTx.finish();
  [...layer.children].forEach(c=>{ if(c!==presCur) layer.removeChild(c); });   // restos de una transición a medias
  const old = presCur;
  const s = document.createElement('div'); s.className='slide'; s.innerHTML=html;
  presCur = s;
  const key = presFrameKey(s);
  const same = !!(old && key && key===old.dataset.frame);
  s.dataset.frame = key;
  let mode = (!old || !dir || !motionOk || PRES.transition==='none') ? 'none' : (same ? 'keep' : PRES.transition);
  const drop = ()=>{ if(old && old.parentNode===layer) layer.removeChild(old); };
  const next2 = fn => requestAnimationFrame(()=>requestAnimationFrame(fn));

  // Cierre común: una sola vez, venga del evento o del respaldo por tiempo.
  const run = (target, evName, ms, done) => {
    let over = false, timer = 0;
    const onEnd = e => { if(e.target===target) finish(); };
    const finish = () => {
      if(over) return; over = true;
      clearTimeout(timer); target.removeEventListener(evName, onEnd);
      done();
      if(presTx===tx) presTx = null;
    };
    const tx = { finish };
    target.addEventListener(evName, onEnd);
    timer = setTimeout(finish, ms);
    presTx = tx;
  };

  if(mode==='keep'){
    s.classList.add('keep'); s.style.setProperty('--dx', dir>0 ? 1 : -1);
    layer.appendChild(s); drop();                     // mismo marco: la anterior queda tapada al instante
    const body = s.querySelector('.sl-body');
    if(body) run(body, 'animationend', 450, ()=>s.classList.remove('keep'));
    else s.classList.remove('keep');
  } else if(mode==='cover' && dir>0){
    // (los requestAnimationFrame pueden llegar después del respaldo si la pestaña está
    // oculta: solo actúan si la transición sigue viva)
    s.classList.add('from-right'); layer.appendChild(s);
    next2(()=>{ if(s.classList.contains('from-right')) s.classList.add('in'); });
    run(s, 'transitionend', 500, ()=>{ drop(); s.classList.remove('from-right','in'); });
  } else if(mode==='cover'){
    layer.insertBefore(s, old);
    next2(()=>{ if(old.parentNode) old.classList.add('to-right'); });
    run(old, 'transitionend', 500, drop);
  } else if(mode==='fade'){
    s.classList.add('fade-in'); layer.appendChild(s);
    next2(()=>{ if(s.classList.contains('fade-in')){ s.classList.add('in'); old.classList.add('fade-out'); } });
    run(s, 'transitionend', 450, ()=>{ drop(); s.classList.remove('fade-in','in'); });
  } else {
    layer.innerHTML=''; layer.appendChild(s);
  }
  presFitOverflow(s);
}
// Control de desborde: si el cuerpo no cabe en la lámina, en modo autor (vista previa)
// se marca «Excede la lámina»; en modo normal se encoge el bloque en pasos hasta 80 %.
function presFitOverflow(s){
  const body = s.querySelector('.sl-body'), fit = s.querySelector('.sl-fit');
  if(!body || !fit) return;
  const avail = body.clientHeight;
  if(fit.scrollHeight <= avail+1) return;
  if(T && T.preview && !T.repaso){
    const b=document.createElement('div'); b.className='sl-over'; b.textContent='Excede la lámina';
    s.firstElementChild.appendChild(b); return;
  }
  for(const k of [0.95,0.9,0.85,0.8]){
    fit.style.transform=`scale(${k})`; fit.style.width=`${100/k}%`;
    if(fit.scrollHeight*k <= avail+1) break;
  }
}

// ---------- boot ----------
// La carga inicial enciende la barra de carga (la pantalla ya dice «Cargando adiestramiento…»).
if(repasoId){
  whileBusy(null, startRepaso);
} else if(reviewId){
  el('prevBtn').onclick = () => { if(T.idx>0){ T.idx--; renderStepReview(); } };
  el('nextBtn').onclick = () => { if(T.idx<T.pages.length){ T.idx++; renderStepReview(); } };
  whileBusy(null, startReview);
} else if(previewId){
  whileBusy(null, startPreview);
} else {
  whileBusy(null, startTake);
}
